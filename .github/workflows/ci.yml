name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gemcp
          POSTGRES_PASSWORD: gemcp-test-password
          POSTGRES_DB: gemcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gemcp -d gemcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEMCP_TEST_DATABASE_URL: postgres://gemcp:gemcp-test-password@127.0.0.1:5432/gemcp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: ./scripts/stage-frontend.sh
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build -tags webembed ./cmd/gemcp
