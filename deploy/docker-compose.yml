services:
  controlplane:
    build:
      context: ..
      args:
        VERSION: ${GEMCP_VERSION:-dev}
        COMMIT: ${GEMCP_COMMIT:-unknown}
        BUILT_AT: ${GEMCP_BUILT_AT:-unknown}
    image: gemcp:${GEMCP_VERSION:-dev}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GEMCP_DATABASE_URL: ${GEMCP_DATABASE_URL}
    ports:
      - "127.0.0.1:${GEMCP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  watchdog:
    build:
      context: ..
      args:
        VERSION: ${GEMCP_VERSION:-dev}
        COMMIT: ${GEMCP_COMMIT:-unknown}
        BUILT_AT: ${GEMCP_BUILT_AT:-unknown}
    image: gemcp:${GEMCP_VERSION:-dev}
    command: ["watchdog"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GEMCP_DATABASE_URL: ${GEMCP_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # A user-created 0700 bind root must be traversable after the official entrypoint drops privileges.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown postgres:postgres /var/lib/postgresql
        chmod 0700 /var/lib/postgresql
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gemcp}
    volumes:
      - ${GEMCP_POSTGRES_DATA_DIR:-./postgres_data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemcp} -d ${POSTGRES_DB:-gemcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: gemcp
